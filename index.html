    <script>
      // Suppress benign preview iFrame HMR WebSocket reconnection notice
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event &&
          event.reason &&
          (event.reason.message?.includes('WebSocket closed without opened') ||
            String(event.reason).includes('WebSocket closed without opened'))
        ) {
          event.preventDefault();
        }
      });
    </script>
